name: API Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Local BOLA and Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile src/*.py

      - name: Start secure mock API
        run: |
          python -u src/mock_api.py > /tmp/secure-api.log 2>&1 &
          echo $! > /tmp/secure-api.pid

      - name: Start vulnerable lab API
        run: |
          python -u src/mock_api_vulnerable_lab.py > /tmp/vulnerable-api.log 2>&1 &
          echo $! > /tmp/vulnerable-api.pid

      - name: Wait for APIs
        run: |
          python - <<'PY'
          import socket
          import time
          import sys

          for port in (8000, 8001):
              for attempt in range(30):
                  try:
                      with socket.create_connection(
                          ("127.0.0.1", port), timeout=1
                      ):
                          print(f"API port {port} siap.")
                          break
                  except OSError:
                      time.sleep(1)
              else:
                  print(f"API port {port} tidak siap.")
                  sys.exit(1)

          print("Kedua mock API siap.")
          PY

      - name: Run BOLA comparison
        run: python src/bola_test.py

      - name: Run regression tests
        run: python src/regression_test.py

      - name: Generate Markdown report
        run: python src/markdown_report.py

      - name: Generate HTML report
        run: python src/html_report.py

      - name: Validate generated v1.0.0 reports
        run: |
          python - <<'PYREPORT'
          import json
          from pathlib import Path

          comparison = json.loads(
              Path("reports/bola_comparison.json").read_text(encoding="utf-8")
          )
          markdown = Path("reports/security_report_v1.0.0.md")
          html = Path("reports/security_report_v1.0.0.html")

          assert comparison.get("version") == "1.0.0", (
              "Versi comparison report bukan 1.0.0"
          )
          assert markdown.is_file(), "Markdown report tidak dibuat"
          assert html.is_file(), "HTML report tidak dibuat"

          md_text = markdown.read_text(encoding="utf-8")
          html_text = html.read_text(encoding="utf-8")

          assert "**Versi:** 1.0.0" in md_text, (
              "Versi di Markdown report salah"
          )
          assert "Version 1.0.0" in html_text, (
              "Versi di HTML report salah"
          )

          print("PASS: kedua laporan v1.0.0 dibuat dan versinya benar.")
          PYREPORT

      - name: Show API logs on failure
        if: failure()
        run: |
          echo "=== Secure API log ==="
          cat /tmp/secure-api.log || true
          echo "=== Vulnerable API log ==="
          cat /tmp/vulnerable-api.log || true

      - name: Upload test reports and API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-sentinel-ci-reports
          if-no-files-found: warn
          path: |
            reports/
            /tmp/secure-api.log
            /tmp/vulnerable-api.log

      - name: Stop mock APIs
        if: always()
        run: |
          if [ -f /tmp/secure-api.pid ]; then
            kill "$(cat /tmp/secure-api.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/vulnerable-api.pid ]; then
            kill "$(cat /tmp/vulnerable-api.pid)" 2>/dev/null || true
          fi
