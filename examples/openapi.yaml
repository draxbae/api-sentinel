openapi: 3.0.3
info:
  title: API Sentinel Practice API
  version: 1.1.0

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token autentikasi untuk lab lokal.

paths:
  /profile:
    get:
      summary: Get current user profile
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successful response
        "401":
          description: Authentication required

  /orders/{order_id}:
    get:
      summary: Get an order
      operationId: getOrder
      security:
        - BearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order found
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Order not found

  /admin/users:
    get:
      summary: List users
      operationId: listUsers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Successful response
        "401":
          description: Authentication required
        "403":
          description: Access denied
